name: CI

# Pull requests: build and test only.
# Pushes to main: build, test and publish the moving tags (7.4, 7.4-fpm, latest, ...).
# Immutable per-release tags come from tag_and_release.yml.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      push: ${{ github.event_name == 'push' }}

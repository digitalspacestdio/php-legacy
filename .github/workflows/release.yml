name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., v1.2.3) - tag must already exist"
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: "Version to release (e.g., v1.2.3) - tag must already exist"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Invalid version format '$VERSION'"
            echo "Expected format: vX.Y.Z (e.g., v1.2.3)"
            exit 1
          fi
          echo "Version format valid: $VERSION"

      - name: Check tag exists
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" > /dev/null; then
            echo "Error: Tag '$VERSION' does not exist"
            exit 1
          fi

  # ===========================================================================
  # Build, test and push every variant from the tagged commit.
  # ===========================================================================
  build:
    needs: [validate]
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.version }}
      version: ${{ inputs.version }}
      push: true

  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download release note rows
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: /tmp/release
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/php-php-eol-cve-2026-109618-109619
        run: |
          set -eu
          {
            echo "Images: \`$IMAGE\`"
            echo
            echo "| Variant | Immutable tag | Digest |"
            echo "| --- | --- | --- |"
            sort /tmp/release/*.md
          } > notes.md
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$VERSION" --notes-file notes.md
